# n8n in queue mode: main (UI/webhooks) + worker (executions), Postgres + Redis.
x-n8n: &n8n
  image: n8nio/n8n:latest
  env_file: .env.n8n          # LENDLOOP_WEBHOOK_SECRET, CONVEX_SITE_URL, N8N_ENCRYPTION_KEY, POSTGRES_PASSWORD, MAIL_FROM, OPS_ALERT_WEBHOOK_URL
  environment:
    - EXECUTIONS_MODE=queue
    - QUEUE_BULL_REDIS_HOST=redis
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_USER=n8n
    - DB_POSTGRESDB_DATABASE=n8n
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - NODE_FUNCTION_ALLOW_BUILTIN=crypto
    - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    - GENERIC_TIMEZONE=Asia/Kolkata
  depends_on: [postgres, redis]
services:
  postgres:
    image: postgres:16
    environment: [POSTGRES_USER=n8n, POSTGRES_DB=n8n, "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"]
    volumes: [pg_data:/var/lib/postgresql/data]
  redis:
    image: redis:7
  n8n:
    <<: *n8n
    ports: ["5678:5678"]
    environment:
      - WEBHOOK_URL=https://ngrok-free.dev
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - GENERIC_TIMEZONE=Asia/Kolkata
  n8n-worker:
    <<: *n8n
    command: worker
volumes:
  pg_data:
